[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sftms"
version = "1.0.0"
description = "Secure File Transfer Monitoring System - a blue-team / DLP toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SFTMS" }]
dependencies = [
    "watchdog>=4.0,<5.0",
    "psutil>=5.9,<8.0",
    "rich>=13.0,<15.0",
    "PyYAML>=6.0,<7.0",
    "Jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
notify = ["plyer>=2.1,<3.0"]
test = ["pytest>=8.0,<10.0"]

[project.scripts]
sftms = "sftms.cli:main"

[tool.setuptools]
packages = ["sftms"]

# --- lint config -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# reporter.py embeds the HTML/CSS report template as a multi-line string;
# wrapping those lines would degrade the template, so long lines are allowed
# there only. Every other file is held to the 100-char limit.
"**/reporter.py" = ["E501"]
